<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mahenoor Kirana Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{600:'#059669',700:'#047857'},energy:{500:'#f97316',600:'#ea580c'}}}}}</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <nav class="bg-white shadow-sm border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <a href="/" class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-sm">M</div><span class="font-extrabold text-lg">Mahenoor <span class="text-energy-600">Kirana</span></span></a>
      <div class="flex items-center gap-4 text-sm font-medium"><a href="/" class="text-slate-600 hover:text-brand-600">Home</a><a href="/pages/cart.html" class="text-slate-600 hover:text-brand-600">Cart</a></div>
    </div>
  </nav>
  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 sm:p-8">
        <div class="text-center mb-6"><div class="w-14 h-14 rounded-2xl bg-brand-100 text-brand-600 flex items-center justify-center text-2xl mx-auto mb-3">🔐</div><h1 class="text-2xl font-extrabold text-slate-800">Welcome Back</h1><p class="text-slate-500 text-sm mt-1">Sign in to your account</p></div>
        <div id="alert" class="hidden p-3 rounded-xl text-sm font-medium mb-4"></div>
        <form id="login-form" class="space-y-4">
          <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label><input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition" placeholder="your@email.com"></div>
          <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label><input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition" placeholder="••••••••"></div>
          <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl transition text-sm">Sign In</button>
        </form>
        <p class="text-center text-sm text-slate-500 mt-6">Don't have an account? <a href="signup.html" class="text-brand-600 font-semibold hover:text-brand-700">Create one</a></p>
      </div>
      <p class="text-center text-xs text-slate-400 mt-4">Demo: admin@mahenoor.com / admin123</p>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      try {
        const res = await apiCall('/auth/login', { method: 'POST', body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
        setAuth(res.token, res.user);
        window.location.href = res.user.role === 'admin' ? '/admin/index.html' : '/';
      } catch (err) {
        alert.className = 'block p-3 rounded-xl text-sm font-medium bg-red-50 text-red-600 border border-red-200';
        alert.textContent = err.message;
      }
    });
  </script>
</body>
</html>
