<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mahenoor Kirana Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b'},energy:{50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f'}}}}}</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-bg min-h-screen flex flex-col">
  <nav class="bg-white/10 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <a href="/" class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-white/20 text-white flex items-center justify-center font-bold text-sm">M</div><span class="font-extrabold text-lg text-white">Mahenoor <span class="text-energy-300">Kirana</span></span></a>
      <div class="flex items-center gap-4 text-sm font-medium"><a href="/" class="text-white/80 hover:text-white transition">Home</a><a href="/" class="text-white/80 hover:text-white transition">Cart</a><button id="dark-mode-btn" onclick="toggleDarkMode()" class="p-2 rounded-xl hover:bg-white/10 transition text-white/80 hover:text-white" title="Dark Mode"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg></button></div>
    </div>
  </nav>
  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="auth-card rounded-2xl shadow-premium-xl p-6 sm:p-8">
        <div data-animate="scale-up" data-animate-delay="100" class="text-center mb-6">
          <div class="w-16 h-16 rounded-2xl gradient-brand text-white flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg shadow-brand-600/30">🔐</div>
          <h1 class="text-2xl font-extrabold text-slate-800">Welcome Back</h1>
          <p class="text-slate-500 text-sm mt-1">Sign in to your account</p>
        </div>
        <div id="alert" class="hidden p-3 rounded-xl text-sm font-medium mb-4"></div>
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
            <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition" placeholder="your@email.com">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
            <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition" placeholder="••••••••">
          </div>
          <button type="submit" class="w-full gradient-brand hover:opacity-90 text-white font-bold py-3 rounded-xl transition text-sm shadow-lg shadow-brand-600/30">Sign In</button>
          <div class="relative my-5"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div><div class="relative flex justify-center"><span class="bg-white px-3 text-xs text-slate-400 font-medium">OR</span></div></div>
          <div class="g_id_signin hidden"></div>
        </form>
        <p class="text-center text-sm text-slate-500 mt-6">Don't have an account? <a href="signup.html" class="text-brand-600 font-semibold hover:text-brand-700">Create one</a></p>
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script>
    async function handleGoogleLogin(response) {
      const alert = document.getElementById('alert');
      try {
        const res = await apiCall('/auth/google', { method: 'POST', body: JSON.stringify({ credential: response.credential }) });
        setAuth(res.token, res.user);
        window.location.href = res.user.role === 'admin' ? '/admin/index.html' : '/';
      } catch (err) {
        alert.className = 'block p-3 rounded-xl text-sm font-medium bg-red-50 text-red-600 border border-red-200';
        alert.textContent = err.message;
      }
    }
    (async function initGoogle() {
      try {
        const cfg = await (await fetch('/api/config')).json();
        if (cfg.googleClientId) {
          const gScript = document.createElement('script');
          gScript.src = 'https://accounts.google.com/gsi/client';
          gScript.onload = () => {
            google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: handleGoogleLogin });
            const btn = document.querySelector('.g_id_signin'); btn.classList.remove('hidden');
            google.accounts.id.renderButton(btn, { type: 'standard', shape: 'pill', theme: 'outline', text: 'signin_with', size: 'large', width: '100%' });
          };
          document.body.appendChild(gScript);
        }
      } catch(e) { console.log('Google sign-in unavailable'); }
    })();
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      try {
        const res = await apiCall('/auth/login', { method: 'POST', body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
        setAuth(res.token, res.user);
        window.location.href = res.user.role === 'admin' ? '/admin/index.html' : '/';
      } catch (err) {
        alert.className = 'block p-3 rounded-xl text-sm font-medium bg-red-50 text-red-600 border border-red-200';
        alert.textContent = err.message;
      }
    });
  </script>
</body>
</html>
