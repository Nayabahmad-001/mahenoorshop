<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Mahenoor Kirana Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{600:'#059669',700:'#047857'},energy:{500:'#f97316',600:'#ea580c'}}}}}</script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .timeline-dot { width: 12px; height: 12px; border-radius: 50%; position: relative; z-index: 1; flex-shrink: 0; }
    .timeline-line { position: absolute; top: 16px; left: 5px; width: 2px; height: calc(100% - 16px); }
    .star-btn { cursor: pointer; transition: transform 0.15s; }
    .star-btn:hover { transform: scale(1.2); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <a href="/" class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-sm">M</div><span class="font-extrabold text-lg">Mahenoor <span class="text-energy-600">Kirana</span></span></a>
      <div class="flex items-center gap-4 text-sm font-medium"><a href="/" class="text-slate-600 hover:text-brand-600">Home</a><a id="nav-orders" href="/pages/my-orders.html" class="text-slate-600 hover:text-brand-600 hidden">My Orders</a><a id="nav-auth" href="/pages/login.html" class="text-slate-600 hover:text-brand-600">Login</a><a id="nav-logout" href="#" onclick="logoutUser(event)" class="text-red-500 hover:text-red-700 hidden">Logout</a></div>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center gap-3 mb-6">
      <a href="/" class="text-slate-400 hover:text-slate-600 transition">&larr; Back</a>
      <h1 class="text-2xl font-extrabold text-slate-800">My Orders</h1>
    </div>
    <div id="orders-container" class="space-y-4"></div>
  </div>

  <!-- Floating WhatsApp -->
  <a href="https://wa.me/919341782080?text=Hi!%20I%20want%20to%20order%20from%20Mahenoor%20Kirana" target="_blank" class="whatsapp-float" title="Order on WhatsApp" aria-label="Chat on WhatsApp">
    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <script src="/js/auth.js"></script>
  <script>
    const STATUS = {
      pending: { bg: 'bg-amber-100', text: 'text-amber-700', label: 'Pending', icon: '⏳', color: '#f59e0b' },
      confirmed: { bg: 'bg-blue-100', text: 'text-blue-700', label: 'Confirmed', icon: '✅', color: '#3b82f6' },
      dispatched: { bg: 'bg-purple-100', text: 'text-purple-700', label: 'Dispatched', icon: '🚚', color: '#8b5cf6' },
      delivered: { bg: 'bg-emerald-100', text: 'text-emerald-700', label: 'Delivered', icon: '📦', color: '#10b981' },
      cancelled: { bg: 'bg-red-100', text: 'text-red-700', label: 'Cancelled', icon: '❌', color: '#ef4444' }
    };
    const STATUS_ORDER = ['pending', 'confirmed', 'dispatched', 'delivered'];
    let feedbackStates = {};

    function getStatusIcon(status) {
      const s = STATUS[status];
      return s ? `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs" style="background:${s.color}20;color:${s.color}">${s.icon}</span>` : status;
    }

    function renderTimeline(status, statusHistory) {
      if (status === 'cancelled') {
        const cancelEntry = statusHistory ? statusHistory.find(s => s.status === 'cancelled') : null;
        return `<div class="flex items-start gap-3 mt-4 pt-4 border-t border-slate-100">
          <div class="flex flex-col items-center">
            <div class="timeline-dot" style="background:#ef4444"></div>
          </div>
          <div class="flex-1">
            <p class="text-sm font-semibold text-red-600">❌ Cancelled</p>
            <p class="text-xs text-slate-400 mt-0.5">${cancelEntry ? new Date(cancelEntry.timestamp).toLocaleString('en-IN') : ''}</p>
            ${cancelEntry?.note ? `<p class="text-xs text-red-500 mt-1">Reason: ${cancelEntry.note}</p>` : ''}
          </div>
        </div>`;
      }

      let reachedCurrent = false;
      return `<div class="relative mt-4 pt-4 border-t border-slate-100">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">📦 Order Timeline</p>
        <div class="space-y-0">${STATUS_ORDER.map((s, i) => {
          const idx = statusHistory ? statusHistory.findIndex(h => h.status === s) : -1;
          const entry = idx >= 0 ? statusHistory[idx] : null;
          const isComplete = STATUS_ORDER.indexOf(status) >= i && status !== 'cancelled';
          const isCurrent = s === status;
          if (isCurrent) reachedCurrent = true;
          const dotColor = isComplete ? STATUS[s].color : '#d1d5db';
          return `<div class="flex items-start gap-3 relative pb-5 last:pb-0">
            ${i < STATUS_ORDER.length - 1 ? `<div class="timeline-line" style="background:${isComplete ? STATUS[s].color : '#e5e7eb'};${!isComplete ? 'background:linear-gradient(to bottom,' + STATUS[s].color + ',#e5e7eb)' : ''}"></div>` : ''}
            <div class="timeline-dot" style="background:${dotColor};${isCurrent ? 'box-shadow:0 0 0 4px ' + dotColor + '40' : ''}"></div>
            <div class="flex-1 ${!isComplete && !isCurrent ? 'opacity-40' : ''}">
              <p class="text-sm font-semibold ${isComplete ? 'text-slate-800' : 'text-slate-400'}">${STATUS[s].icon} ${STATUS[s].label}</p>
              <p class="text-xs text-slate-400 mt-0.5">${entry ? new Date(entry.timestamp).toLocaleString('en-IN') : isCurrent && !entry ? 'Just now' : ''}</p>
              ${entry?.note ? `<p class="text-xs mt-1 ${s === 'dispatched' ? 'text-blue-600 font-medium' : s === 'delivered' ? 'text-emerald-600' : 'text-slate-500'}">📌 ${entry.note}</p>` : ''}
            </div>
          </div>`;
        }).join('')}</div>
      </div>`;
    }

    function renderFeedbackForm(orderId, feedback) {
      const stateKey = orderId;
      if (!feedbackStates[stateKey]) {
        feedbackStates[stateKey] = {
          rating: feedback ? feedback.rating : 0,
          comment: feedback ? feedback.comment : '',
          submitted: !!feedback,
          loading: false
        };
      }
      const state = feedbackStates[stateKey];
      if (state.submitted) {
        return `<div class="mt-4 pt-4 border-t border-slate-100">
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">⭐ Your Review</p>
          <div class="flex items-center gap-1 mb-1">${[1,2,3,4,5].map(s => `<span class="text-lg ${s <= state.rating ? 'text-amber-400' : 'text-slate-200'}">★</span>`).join('')}</div>
          ${state.comment ? `<p class="text-sm text-slate-600">${state.comment}</p>` : ''}
        </div>`;
      }
      return `<div class="mt-4 pt-4 border-t border-slate-100">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">⭐ Rate Your Order</p>
        <div class="flex items-center gap-1 mb-3">${[1,2,3,4,5].map(s =>
          `<button onclick="setRating('${orderId}', ${s})" class="star-btn p-2 text-2xl leading-none ${s <= state.rating ? 'text-amber-400' : 'text-slate-200'} transition">★</button>`
        ).join('')}</div>
        <textarea id="feedback-comment-${orderId}" rows="2" class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 transition resize-none" placeholder="Share your experience (optional)">${state.comment}</textarea>
        <button onclick="submitFeedback('${orderId}')" id="feedback-btn-${orderId}" class="mt-2 px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-xl transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          Submit Feedback
        </button>
      </div>`;
    }

    function setRating(orderId, rating) {
      const key = orderId;
      if (!feedbackStates[key]) feedbackStates[key] = { rating: 0, comment: '', submitted: false, loading: false };
      feedbackStates[key].rating = rating;
      const orderEl = document.querySelector(`[data-order-id="${orderId}"]`);
      if (orderEl) {
        const feedbackSection = orderEl.querySelector('.feedback-section');
        const state = feedbackStates[key];
        feedbackSection.innerHTML = renderFeedbackForm(orderId, null);
      }
    }

    async function submitFeedback(orderId) {
      const key = orderId;
      const state = feedbackStates[key];
      if (!state || state.rating === 0) { alert('Please select a rating'); return; }
      state.comment = document.getElementById(`feedback-comment-${orderId}`)?.value || '';
      const btn = document.getElementById(`feedback-btn-${orderId}`);
      btn.disabled = true;
      btn.innerHTML = '<span class="inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> Submitting...';
      try {
        await apiCall('/feedback', {
          method: 'POST',
          body: JSON.stringify({ orderId, rating: state.rating, comment: state.comment })
        });
        state.submitted = true;
        const orderEl = document.querySelector(`[data-order-id="${orderId}"]`);
        if (orderEl) {
          const feedbackSection = orderEl.querySelector('.feedback-section');
          feedbackSection.innerHTML = renderFeedbackForm(orderId, { rating: state.rating, comment: state.comment });
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Submit Feedback';
        alert(err.message);
      }
    }

    async function loadOrders() {
      const container = document.getElementById('orders-container');
      if (!isLoggedIn()) { container.innerHTML = '<div class="text-center py-16 text-slate-400"><p class="text-lg">Please <a href="/pages/login.html" class="text-brand-600 font-semibold">login</a> to view orders.</p></div>'; return; }
      try {
        const res = await apiCall('/orders/my-orders');
        const orders = res.orders || [];

        const feedbackRes = await apiCall('/feedback/my-feedback').catch(() => ({ feedbacks: [] }));
        const myFeedbacks = {};
        (feedbackRes.feedbacks || []).forEach(f => { myFeedbacks[f.order] = f; });

        if (orders.length === 0) { container.innerHTML = '<div class="text-center py-16 text-slate-400"><div class="text-5xl mb-3">📭</div><p class="text-lg font-medium">No orders yet</p><a href="/" class="text-brand-600 font-semibold text-sm mt-1 inline-block">Start shopping →</a></div>'; return; }
        container.innerHTML = orders.map(o => {
          const s = STATUS[o.status] || { bg: 'bg-slate-100', text: 'text-slate-700' };
          const fb = myFeedbacks[o._id];
          if (fb) {
            feedbackStates[o._id] = { rating: fb.rating, comment: fb.comment || '', submitted: true, loading: false };
          }
          const paymentBadge = o.paymentMethod === 'razorpay'
            ? `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ${o.paymentStatus === 'paid' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${o.paymentStatus === 'paid' ? '💳 Paid' : '💳 Unpaid'}</span>`
            : '<span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">💵 COD</span>';
          return `<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 slide-up" data-order-id="${o._id}">
            <div class="flex items-start justify-between">
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-xs text-slate-400 font-mono">#${o._id.slice(-10).toUpperCase()}</span>
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${s.bg} ${s.text} capitalize">${getStatusIcon(o.status)} ${o.status}</span>
                  ${paymentBadge}
                </div>
                <p class="text-xs text-slate-400 mt-1">${new Date(o.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>
              </div>
              <div class="text-right">
                <p class="text-lg font-extrabold text-brand-700">₹${o.total || o.subtotal}</p>
                ${o.totalSavings > 0 ? `<p class="text-xs text-emerald-600 font-medium">Save ₹${o.totalSavings}</p>` : ''}
                ${o.deliveryCharge > 0 ? `<p class="text-xs text-slate-400">+₹${o.deliveryCharge} delivery</p>` : '<p class="text-xs text-emerald-600 font-medium">Free delivery</p>'}
              </div>
            </div>
            <div class="mt-4 space-y-2">${o.items.map(i => `<div class="flex items-center gap-3 text-sm"><div class="w-10 h-10 rounded-lg shrink-0 overflow-hidden bg-slate-100">${i.image ? `<img src="${i.image}" class="w-full h-full object-cover" onerror="this.outerHTML='<div class=\\'w-10 h-10 flex items-center justify-center text-sm\\'>📦</div>'">` : '<div class="w-10 h-10 flex items-center justify-center text-sm">📦</div>'}</div><div class="flex-1 min-w-0"><p class="font-medium text-slate-800 text-sm truncate">${i.name}</p><p class="text-xs text-slate-400">Qty: ${i.quantity} × ₹${i.sellingPrice}</p></div><span class="font-semibold shrink-0 text-sm">₹${i.sellingPrice * i.quantity}</span></div>`).join('')}</div>
            ${o.shippingAddress ? `<div class="mt-3 text-xs text-slate-400 flex items-start gap-1.5"><span>📍</span><span>${o.shippingAddress.street}, ${o.shippingAddress.city}, ${o.shippingAddress.state} ${o.shippingAddress.pincode}${o.deliveryLocation?.lat ? ` <a href="https://www.google.com/maps?q=${o.deliveryLocation.lat},${o.deliveryLocation.lng}" target="_blank" class="text-blue-600 hover:underline font-medium">(View on Map)</a>` : ''}</span></div>` : ''}
            ${o.status === 'dispatched' || o.status === 'delivered' ? `
            <div class="mt-3 border rounded-xl overflow-hidden ${o.status === 'delivered' ? 'border-emerald-200' : 'border-blue-200'}">
              <div class="p-4 ${o.status === 'delivered' ? 'bg-emerald-50' : 'bg-blue-50'}">
                <div class="flex items-start gap-3">
                  <div class="w-10 h-10 rounded-full ${o.status === 'delivered' ? 'bg-emerald-500' : 'bg-blue-500'} text-white flex items-center justify-center text-lg shrink-0">🚚</div>
                  <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-slate-800">${o.deliveryPartner?.name || 'Delivery Partner'}</p>
                    ${o.deliveryPartner?.phone ? `<a href="tel:${o.deliveryPartner.phone}" class="text-sm font-semibold text-blue-600 hover:text-blue-700 flex items-center gap-1">📞 ${o.deliveryPartner.phone}</a>` : ''}
                  </div>
                  ${o.status === 'dispatched' && o.deliveryOtp ? `<div class="shrink-0 text-right"><p class="text-[10px] text-blue-500 font-medium">OTP</p><p class="text-xl font-extrabold text-blue-600 tracking-widest">${o.deliveryOtp}</p></div>` : ''}
                </div>
              </div>
              ${o.deliveryLocation?.lat ? `<div id="map-${o._id}" class="w-full h-48 sm:h-56"></div>` : ''}
            </div>` : ''}
            ${renderTimeline(o.status, o.statusHistory)}
            <div class="feedback-section">${o.status === 'delivered' ? renderFeedbackForm(o._id, fb) : ''}</div>
          </div>`;
        }).join('');
        orders.filter(o => o.deliveryLocation?.lat && (o.status === 'dispatched' || o.status === 'delivered')).forEach(o => {
          setTimeout(() => initOrderMap(o._id, o.deliveryLocation.lat, o.deliveryLocation.lng), 100);
        });
      } catch (err) { container.innerHTML = `<p class="text-red-500">${err.message}</p>`; }
    }

    function initOrderMap(orderId, lat, lng) {
      const el = document.getElementById(`map-${orderId}`);
      if (!el || el.dataset.initialized) return;
      el.dataset.initialized = '1';
      const map = L.map(el, { zoomControl: false }).setView([lat, lng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      L.marker([lat, lng], { draggable: false }).addTo(map).bindPopup('📍 Delivery Location');
      setTimeout(() => map.invalidateSize(), 200);
    }
    let refreshInterval;
    document.addEventListener('DOMContentLoaded', () => {
      loadOrders();
      refreshInterval = setInterval(loadOrders, 30000);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { clearInterval(refreshInterval); }
      else { loadOrders(); refreshInterval = setInterval(loadOrders, 30000); }
    });
  </script>
</body>
</html>
