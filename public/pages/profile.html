<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Mahenoor Kirana Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{600:'#059669',700:'#047857'},energy:{500:'#f97316',600:'#ea580c'}}}}}</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen">
  <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <a href="/" class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-sm">M</div><span class="font-extrabold text-lg">Mahenoor <span class="text-energy-600">Kirana</span></span></a>
      <div class="flex items-center gap-4 text-sm font-medium"><a href="/" class="text-slate-600 hover:text-brand-600">Home</a><a id="nav-orders" href="/pages/my-orders.html" class="text-slate-600 hover:text-brand-600 hidden">My Orders</a><a id="nav-auth" href="/pages/login.html" class="text-slate-600 hover:text-brand-600">Login</a><a id="nav-logout" href="#" onclick="logoutUser(event)" class="text-red-500 hover:text-red-700 hidden">Logout</a></div>
    </div>
  </nav>

  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center gap-3 mb-6">
      <a href="/" class="text-slate-400 hover:text-slate-600 transition">&larr; Back</a>
      <h1 class="text-2xl font-extrabold text-slate-800">My Profile</h1>
    </div>

    <div id="not-logged-in" class="hidden text-center py-16 text-slate-400">
      <p class="text-lg">Please <a href="/pages/login.html" class="text-brand-600 font-semibold">login</a> to view your profile.</p>
    </div>

    <div id="profile-content" class="hidden space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div class="flex flex-col sm:flex-row items-center gap-4 mb-6">
          <div class="w-16 h-16 rounded-full bg-brand-600 text-white flex items-center justify-center text-2xl font-bold" id="profile-avatar"></div>
          <div class="text-center sm:text-left">
            <h2 class="text-xl font-bold text-slate-800" id="profile-name"></h2>
            <p class="text-sm text-slate-400" id="profile-email"></p>
          </div>
          <div class="flex items-center gap-2 sm:ml-auto">
            <a href="/pages/my-orders.html" class="text-sm font-semibold text-brand-600 hover:text-brand-700 bg-brand-50 hover:bg-brand-100 px-4 py-2 rounded-xl transition flex items-center gap-1.5">
              📋 My Orders
            </a>
            <button onclick="logoutUser()" class="text-sm font-semibold text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-4 py-2 rounded-xl transition">
              🚪 Logout
            </button>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h3 class="text-lg font-bold text-slate-800 mb-5">Edit Details</h3>
        <div id="profile-alert" class="hidden p-3 rounded-xl text-sm font-medium mb-4"></div>
        <form id="profile-form" class="space-y-4">
          <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">Full Name</label><input type="text" id="p-name" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition"></div>
          <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">Phone Number</label><input type="tel" id="p-phone" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition" placeholder="10-digit mobile number"></div>
          <div class="border-t border-slate-100 pt-4">
            <h4 class="text-sm font-bold text-slate-700 mb-3">Default Address</h4>
            <div class="space-y-3">
              <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">Street / Area</label><input type="text" id="p-street" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition" placeholder="House no., street, locality"></div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="col-span-1"><label class="block text-sm font-semibold text-slate-700 mb-1.5">City</label><input type="text" id="p-city" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition"></div>
                <div class="col-span-1"><label class="block text-sm font-semibold text-slate-700 mb-1.5">State</label><input type="text" id="p-state" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition"></div>
                <div class="col-span-1"><label class="block text-sm font-semibold text-slate-700 mb-1.5">Pincode</label><input type="text" id="p-pincode" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition" maxlength="6"></div>
              </div>
            </div>
          </div>
          <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl transition text-sm flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            Save Changes
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Floating WhatsApp -->
  <a href="https://wa.me/919341782080?text=Hi!%20I%20want%20to%20order%20from%20Mahenoor%20Kirana" target="_blank" class="whatsapp-float" title="Order on WhatsApp" aria-label="Chat on WhatsApp">
    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <script src="/js/auth.js"></script>
  <script>
    async function loadProfile() {
      if (!isLoggedIn()) {
        document.getElementById('not-logged-in').classList.remove('hidden');
        return;
      }
      document.getElementById('profile-content').classList.remove('hidden');
      try {
        const res = await apiCall('/auth/me');
        const u = res.user;
        document.getElementById('profile-avatar').textContent = u.name.charAt(0).toUpperCase();
        document.getElementById('profile-name').textContent = u.name;
        document.getElementById('profile-email').textContent = u.email;
        document.getElementById('p-name').value = u.name || '';
        document.getElementById('p-phone').value = u.phone || '';
        document.getElementById('p-street').value = u.address?.street || '';
        document.getElementById('p-city').value = u.address?.city || '';
        document.getElementById('p-state').value = u.address?.state || '';
        document.getElementById('p-pincode').value = u.address?.pincode || '';
      } catch (err) {
        document.getElementById('profile-content').innerHTML = `<p class="text-red-500">${err.message}</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      const form = document.getElementById('profile-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const alert = document.getElementById('profile-alert');
        try {
          const payload = {
            name: document.getElementById('p-name').value,
            phone: document.getElementById('p-phone').value,
            address: {
              street: document.getElementById('p-street').value,
              city: document.getElementById('p-city').value,
              state: document.getElementById('p-state').value,
              pincode: document.getElementById('p-pincode').value
            }
          };
          const res = await apiCall('/auth/profile', { method: 'PUT', body: JSON.stringify(payload) });
          const u = res.user;
          localStorage.setItem('user', JSON.stringify(u));
          document.getElementById('profile-avatar').textContent = u.name.charAt(0).toUpperCase();
          document.getElementById('profile-name').textContent = u.name;
          alert.className = 'block p-3 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-200';
          alert.textContent = 'Profile updated successfully!';
          alert.classList.remove('hidden');
          setTimeout(() => { alert.className = 'hidden'; }, 3000);
        } catch (err) {
          alert.className = 'block p-3 rounded-xl text-sm font-medium bg-red-50 text-red-600 border border-red-200';
          alert.textContent = err.message;
          alert.classList.remove('hidden');
        }
      });
    });
  </script>
</body>
</html>
