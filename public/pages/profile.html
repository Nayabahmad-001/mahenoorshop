<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Mahenoor Kirana Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b'},energy:{50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f'}}}}}</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen">
  <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <a href="/" class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-sm">M</div><span class="font-extrabold text-lg">Mahenoor <span class="text-energy-600">Kirana</span></span></a>
      <div class="flex items-center gap-4 text-sm font-medium"><button id="dark-mode-btn" onclick="toggleDarkMode()" class="p-2 rounded-xl hover:bg-slate-100 transition text-slate-500 hover:text-brand-600" title="Dark Mode"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg></button><a href="/" class="text-slate-600 hover:text-brand-600">Home</a><a id="nav-orders" href="/pages/my-orders.html" class="text-slate-600 hover:text-brand-600 hidden">My Orders</a><a id="nav-auth" href="/pages/login.html" class="text-slate-600 hover:text-brand-600">Login</a><a id="nav-logout" href="#" onclick="logoutUser(event)" class="text-red-500 hover:text-red-700 hidden">Logout</a></div>
    </div>
  </nav>

  <div data-animate="slide-up" class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center gap-3 mb-6">
      <a href="/" class="text-slate-400 hover:text-slate-600 transition">&larr; Back</a>
      <h1 class="text-2xl font-extrabold text-slate-800">My Profile</h1>
    </div>

    <div id="not-logged-in" class="hidden text-center py-16 text-slate-400">
      <p class="text-lg">Please <a href="/pages/login.html" class="text-brand-600 font-semibold">login</a> to view your profile.</p>
    </div>

    <div id="profile-content" class="hidden space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div class="flex flex-col sm:flex-row items-center gap-4 mb-6">
          <div class="w-16 h-16 rounded-full bg-brand-600 text-white flex items-center justify-center text-2xl font-bold" id="profile-avatar"></div>
          <div class="text-center sm:text-left">
            <h2 class="text-xl font-bold text-slate-800" id="profile-name"></h2>
            <p class="text-sm text-slate-400" id="profile-email"></p>
          </div>
          <div class="flex items-center gap-2 sm:ml-auto">
            <a href="/pages/my-orders.html" class="text-sm font-semibold text-brand-600 hover:text-brand-700 bg-brand-50 hover:bg-brand-100 px-4 py-2 rounded-xl transition flex items-center gap-1.5">📋 My Orders</a>
            <button onclick="logoutUser()" class="text-sm font-semibold text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-4 py-2 rounded-xl transition">🚪 Logout</button>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h3 class="text-lg font-bold text-slate-800 mb-5">Edit Details</h3>
        <div id="profile-alert" class="hidden p-3 rounded-xl text-sm font-medium mb-4"></div>
        <form id="profile-form" class="space-y-4">
          <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">Full Name</label><input type="text" id="p-name" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition"></div>
          <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">Phone Number</label><input type="tel" id="p-phone" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition" placeholder="10-digit mobile number"></div>
          <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl transition text-sm flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            Save Changes
          </button>
        </form>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div class="flex items-center justify-between mb-5">
          <h3 class="text-lg font-bold text-slate-800">📍 Saved Addresses</h3>
          <button onclick="openAddressModal()" class="text-sm font-semibold text-brand-600 hover:text-brand-700 bg-brand-50 hover:bg-brand-100 px-4 py-2 rounded-xl transition">+ Add New</button>
        </div>
        <div id="addresses-list" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <!-- Address Modal -->
  <div id="address-modal" class="modal-overlay">
    <div class="modal-content p-6">
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-lg font-bold text-slate-800" id="addr-modal-title">Add Address</h3>
        <button onclick="closeAddressModal()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
      </div>
      <div id="addr-modal-alert" class="hidden p-3 rounded-xl text-sm font-medium mb-4"></div>
      <input type="hidden" id="addr-edit-id" value="">
      <div class="space-y-4">
        <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">Label</label>
          <select id="addr-label" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 transition">
            <option value="Home">Home</option>
            <option value="Work">Work</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">Street / Area</label><input type="text" id="addr-street" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 transition" placeholder="House no., street, locality"></div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">City</label><input type="text" id="addr-city" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 transition"></div>
          <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">State</label><input type="text" id="addr-state" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 transition"></div>
          <div><label class="block text-sm font-semibold text-slate-700 mb-1.5">Pincode</label><input type="text" id="addr-pincode" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500 transition" maxlength="6"></div>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="addr-default" class="rounded border-slate-300 text-brand-600">
          <label for="addr-default" class="text-sm text-slate-700">Set as default address</label>
        </div>
        <button onclick="saveAddress()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl transition text-sm">Save Address</button>
      </div>
    </div>
  </div>

  <a href="https://wa.me/919341782080?text=Hi!%20I%20want%20to%20order%20from%20Mahenoor%20Kirana" target="_blank" class="whatsapp-float" title="Order on WhatsApp">
    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <script src="/js/auth.js"></script>
  <script>
    function loadProfile() {
      if (!isLoggedIn()) {
        document.getElementById('not-logged-in').classList.remove('hidden');
        return;
      }
      document.getElementById('profile-content').classList.remove('hidden');
      loadUserData();
    }

    async function loadUserData() {
      try {
        const res = await apiCall('/auth/me');
        const u = res.user;
        document.getElementById('profile-avatar').textContent = u.name.charAt(0).toUpperCase();
        document.getElementById('profile-name').textContent = u.name;
        document.getElementById('profile-email').textContent = u.email;
        document.getElementById('p-name').value = u.name || '';
        document.getElementById('p-phone').value = u.phone || '';
        renderAddresses(u.addresses || []);
      } catch (err) {
        document.getElementById('profile-content').innerHTML = `<p class="text-red-500">${err.message}</p>`;
      }
    }

    function renderAddresses(addresses) {
      const container = document.getElementById('addresses-list');
      if (!addresses || addresses.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-slate-400"><div class="text-3xl mb-2">📍</div><p class="text-sm">No saved addresses yet</p></div>';
        return;
      }
      container.innerHTML = addresses.map(a => {
        const labelColors = { Home: 'bg-brand-100 text-brand-700', Work: 'bg-blue-100 text-blue-700', Other: 'bg-slate-100 text-slate-600' };
        const labelColor = labelColors[a.label] || labelColors.Other;
        return `<div class="flex items-start gap-3 p-4 rounded-xl border border-slate-200 hover:border-slate-300 transition">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap"><span class="text-xs font-bold px-2 py-0.5 rounded-full ${labelColor}">${a.label}</span>${a.isDefault ? '<span class="text-xs font-semibold text-brand-600 bg-brand-50 px-2 py-0.5 rounded-full">★ Default</span>' : ''}</div>
            <p class="text-sm text-slate-700 mt-1">${a.street}, ${a.city}${a.state ? ', ' + a.state : ''}${a.pincode ? ' - ' + a.pincode : ''}</p>
            ${a.lat && a.lng ? `<a href="https://www.google.com/maps?q=${a.lat},${a.lng}" target="_blank" class="text-xs text-blue-600 hover:underline">View on Map</a>` : ''}
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="editAddress('${a._id}')" class="px-3 py-1.5 text-xs font-semibold bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100 transition">Edit</button>
            <button onclick="deleteAddress('${a._id}')" class="px-3 py-1.5 text-xs font-semibold bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition">Del</button>
          </div>
        </div>`;
      }).join('');
    }

    function openAddressModal(addr) {
      document.getElementById('addr-modal-title').textContent = addr ? 'Edit Address' : 'Add Address';
      document.getElementById('addr-edit-id').value = addr ? addr._id : '';
      document.getElementById('addr-label').value = addr ? (addr.label || 'Home') : 'Home';
      document.getElementById('addr-street').value = addr ? (addr.street || '') : '';
      document.getElementById('addr-city').value = addr ? (addr.city || '') : '';
      document.getElementById('addr-state').value = addr ? (addr.state || '') : '';
      document.getElementById('addr-pincode').value = addr ? (addr.pincode || '') : '';
      document.getElementById('addr-default').checked = addr ? !!addr.isDefault : false;
      document.getElementById('addr-modal-alert').className = 'hidden';
      document.getElementById('address-modal').classList.add('open');
    }

    function closeAddressModal() {
      document.getElementById('address-modal').classList.remove('open');
    }

    async function saveAddress() {
      const alert = document.getElementById('addr-modal-alert');
      const editId = document.getElementById('addr-edit-id').value;
      const payload = {
        label: document.getElementById('addr-label').value,
        street: document.getElementById('addr-street').value,
        city: document.getElementById('addr-city').value,
        state: document.getElementById('addr-state').value,
        pincode: document.getElementById('addr-pincode').value,
        isDefault: document.getElementById('addr-default').checked
      };
      if (!payload.street || !payload.city || !payload.pincode) {
        alert.className = 'block p-3 rounded-xl text-sm font-medium bg-red-50 text-red-600 border border-red-200';
        alert.textContent = 'Street, city, and pincode are required';
        alert.classList.remove('hidden');
        return;
      }
      try {
        let res;
        if (editId) {
          res = await apiCall(`/auth/addresses/${editId}`, { method: 'PUT', body: JSON.stringify(payload) });
        } else {
          res = await apiCall('/auth/addresses', { method: 'POST', body: JSON.stringify(payload) });
        }
        closeAddressModal();
        const user = getUser();
        user.addresses = res.addresses;
        localStorage.setItem('user', JSON.stringify(user));
        renderAddresses(res.addresses);
        if (editId) {
          showProfileAlert('Address updated!', 'emerald');
        } else {
          showProfileAlert('Address added!', 'emerald');
        }
      } catch (err) {
        alert.className = 'block p-3 rounded-xl text-sm font-medium bg-red-50 text-red-600 border border-red-200';
        alert.textContent = err.message;
        alert.classList.remove('hidden');
      }
    }

    function editAddress(id) {
      const user = getUser();
      const addr = (user.addresses || []).find(a => a._id === id);
      if (addr) openAddressModal(addr);
    }

    async function deleteAddress(id) {
      if (!confirm('Delete this address?')) return;
      try {
        const res = await apiCall(`/auth/addresses/${id}`, { method: 'DELETE' });
        const user = getUser();
        user.addresses = res.addresses;
        localStorage.setItem('user', JSON.stringify(user));
        renderAddresses(res.addresses);
        showProfileAlert('Address deleted', 'emerald');
      } catch (err) {
        showProfileAlert(err.message, 'red');
      }
    }

    function showProfileAlert(msg, type) {
      const alert = document.getElementById('profile-alert');
      alert.className = `block p-3 rounded-xl text-sm font-medium bg-${type}-50 text-${type}-600 border border-${type}-200`;
      alert.textContent = msg;
      alert.classList.remove('hidden');
      setTimeout(() => { alert.className = 'hidden'; }, 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      const form = document.getElementById('profile-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const alert = document.getElementById('profile-alert');
        try {
          const payload = {
            name: document.getElementById('p-name').value,
            phone: document.getElementById('p-phone').value
          };
          const res = await apiCall('/auth/profile', { method: 'PUT', body: JSON.stringify(payload) });
          const u = res.user;
          localStorage.setItem('user', JSON.stringify(u));
          document.getElementById('profile-avatar').textContent = u.name.charAt(0).toUpperCase();
          document.getElementById('profile-name').textContent = u.name;
          showProfileAlert('Profile updated successfully!', 'emerald');
        } catch (err) {
          showProfileAlert(err.message, 'red');
        }
      });
    });

    document.getElementById('address-modal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeAddressModal();
    });
  </script>
</body>
</html>
