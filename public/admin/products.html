<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Mahenoor Kirana Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{500:'#10b981',600:'#059669',700:'#047857'},energy:{500:'#f97316',600:'#ea580c'}}}}}</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="flex min-h-screen bg-slate-50">
    <aside class="w-64 bg-slate-900 text-white shrink-0 hidden md:block">
      <div class="p-5 border-b border-slate-800"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center font-bold text-sm">M</div><div><div class="font-bold text-sm">Mahenoor Kirana</div><div class="text-xs text-slate-500">Admin Panel</div></div></div></div>
      <nav class="p-4 space-y-1">
        <a href="/admin/index.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 font-medium text-sm transition">📊 Dashboard</a>
        <a href="/admin/products.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl bg-brand-600/20 text-brand-300 font-medium text-sm">📦 Products</a>
        <a href="/admin/orders.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 font-medium text-sm transition">📋 Orders</a>
        <hr class="border-slate-800 my-3">
        <a href="/" target="_blank" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 font-medium text-sm transition">🏪 View Store</a>
        <a href="#" id="logout-btn" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-red-300 hover:bg-slate-800 font-medium text-sm transition">🚪 Logout</a>
      </nav>
    </aside>

    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 flex">
      <a href="/admin/index.html" class="flex-1 text-center py-4 text-xs font-medium text-slate-500">📊</a>
      <a href="/admin/products.html" class="flex-1 text-center py-4 text-xs font-medium text-brand-600 bg-brand-50">📦</a>
      <a href="/admin/orders.html" class="flex-1 text-center py-4 text-xs font-medium text-slate-500">📋</a>
      <a href="/" target="_blank" class="flex-1 text-center py-4 text-xs font-medium text-slate-500">🏪</a>
      <a href="#" id="logout-btn-mobile" class="flex-1 text-center py-4 text-xs font-medium text-slate-500">🚪</a>
    </div>

    <main class="flex-1 p-4 md:p-8 pb-20 md:pb-8">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-extrabold text-slate-800">Products</h1>
        <div class="flex items-center gap-3">
          <div class="relative">
            <button onclick="toggleNotifications()" class="relative p-2.5 rounded-xl hover:bg-slate-100 transition text-slate-500 hover:text-brand-600" id="notif-btn">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
              <span id="notif-badge" class="absolute -top-0.5 -right-0.5 w-5 h-5 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center hidden">0</span>
            </button>
            <div id="notif-dropdown" class="hidden absolute right-0 top-full mt-2 w-80 sm:w-96 bg-white rounded-2xl shadow-xl border border-slate-200 z-50 max-h-[450px] flex flex-col">
              <div class="flex items-center justify-between p-4 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-sm">Notifications</h3>
                <button onclick="markAllNotifRead()" class="text-xs font-semibold text-brand-600 hover:text-brand-700">Mark all read</button>
              </div>
              <div id="notif-list" class="overflow-y-auto flex-1 p-2 space-y-1">
                <div class="text-center py-8 text-slate-400 text-sm">Loading...</div>
              </div>
            </div>
          </div>
          <button onclick="openModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm px-5 py-3 rounded-xl transition flex items-center gap-2">+ Add Product</button>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <div class="flex flex-wrap items-center gap-3 mb-5">
          <select id="filter-category" onchange="loadProducts()" class="px-4 py-2.5 border-2 border-slate-200 rounded-xl text-sm font-medium text-slate-600 bg-white focus:outline-none focus:border-brand-500">
            <option value="">All Categories</option>
            <option value="Daily Ration">Daily Ration</option>
            <option value="Cold Drinks">Cold Drinks</option>
          </select>
          <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer"><input type="checkbox" id="filter-low-stock" onchange="loadProducts()" class="rounded border-slate-300 text-brand-600 focus:ring-brand-500"> Low Stock Only</label>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs text-slate-500 uppercase tracking-wider"><th class="pb-3 pr-4">Product</th><th class="pb-3 pr-4">Category</th><th class="pb-3 pr-4">MRP</th><th class="pb-3 pr-4">Price</th><th class="pb-3 pr-4">Disc.</th><th class="pb-3 pr-4">Stock</th><th class="pb-3">Actions</th></tr></thead>
            <tbody id="products-tbody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Product Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-content p-6">
      <div class="flex items-center justify-between mb-5"><h3 class="text-xl font-bold text-slate-800" id="modal-title">Add Product</h3><button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button></div>
      <div id="modal-alert" class="hidden p-3 rounded-xl text-sm font-medium mb-4"></div>
      <form id="product-form" class="space-y-4">
        <input type="hidden" id="product-id">
        <div><label class="block text-sm font-semibold text-slate-700 mb-1">Product Name</label><input type="text" id="p-name" required class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500"></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm font-semibold text-slate-700 mb-1">Category</label><select id="p-category" required class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500"><option value="">Select</option><option value="Daily Ration">Daily Ration</option><option value="Cold Drinks">Cold Drinks</option></select></div>
          <div><label class="block text-sm font-semibold text-slate-700 mb-1">Unit</label><input type="text" id="p-unit" placeholder="kg, L, pack" required class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500"></div>
        </div>
        <div><label class="block text-sm font-semibold text-slate-700 mb-1">Description</label><textarea id="p-description" rows="2" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500"></textarea></div>
        <div><label class="block text-sm font-semibold text-slate-700 mb-1">Image URL</label>
          <div class="flex gap-2 items-start">
            <div class="flex-1"><input type="url" id="p-image" placeholder="https://example.com/product.jpg" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500"></div>
            <div id="image-preview" class="w-12 h-12 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-center text-lg text-slate-300 shrink-0 overflow-hidden">🖼️</div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm font-semibold text-slate-700 mb-1">MRP (₹)</label><input type="number" id="p-mrp" step="0.01" min="0" required class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500"></div>
          <div><label class="block text-sm font-semibold text-slate-700 mb-1">Selling Price (₹)</label><input type="number" id="p-price" step="0.01" min="0" required class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm font-semibold text-slate-700 mb-1">Stock</label><input type="number" id="p-stock" min="0" required class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500"></div>
          <div><label class="block text-sm font-semibold text-slate-700 mb-1">Available</label><select id="p-available" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 text-sm focus:outline-none focus:border-brand-500"><option value="true">Yes</option><option value="false">No</option></select></div>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl transition text-sm">Save Product</button>
          <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition text-sm">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
