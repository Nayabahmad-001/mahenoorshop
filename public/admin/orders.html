<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Mahenoor Kirana Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{500:'#10b981',600:'#059669',700:'#047857'},energy:{500:'#f97316',600:'#ea580c'}}}}}</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="flex min-h-screen bg-slate-50">
    <aside class="w-64 bg-slate-900 text-white shrink-0 hidden md:block">
      <div class="p-5 border-b border-slate-800"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center font-bold text-sm">M</div><div><div class="font-bold text-sm">Mahenoor Kirana</div><div class="text-xs text-slate-500">Admin Panel</div></div></div></div>
      <nav class="p-4 space-y-1">
        <a href="/admin/index.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 font-medium text-sm transition">📊 Dashboard</a>
        <a href="/admin/products.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 font-medium text-sm transition">📦 Products</a>
        <a href="/admin/orders.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl bg-brand-600/20 text-brand-300 font-medium text-sm">📋 Orders</a>
        <hr class="border-slate-800 my-3">
        <a href="/" target="_blank" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 font-medium text-sm transition">🏪 View Store</a>
        <a href="#" id="logout-btn" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-red-300 hover:bg-slate-800 font-medium text-sm transition">🚪 Logout</a>
      </nav>
    </aside>

    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 flex">
      <a href="/admin/index.html" class="flex-1 text-center py-3 text-xs font-medium text-slate-500">📊</a>
      <a href="/admin/products.html" class="flex-1 text-center py-3 text-xs font-medium text-slate-500">📦</a>
      <a href="/admin/orders.html" class="flex-1 text-center py-3 text-xs font-medium text-brand-600 bg-brand-50">📋</a>
      <a href="/" target="_blank" class="flex-1 text-center py-3 text-xs font-medium text-slate-500">🏪</a>
      <a href="#" id="logout-btn-mobile" class="flex-1 text-center py-3 text-xs font-medium text-slate-500">🚪</a>
    </div>

    <main class="flex-1 p-4 md:p-8 pb-20 md:pb-8">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-extrabold text-slate-800">Orders</h1>
        <select id="filter-status" onchange="loadOrders()" class="px-4 py-2.5 border-2 border-slate-200 rounded-xl text-sm font-medium text-slate-600 bg-white focus:outline-none focus:border-brand-500">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="dispatched">Dispatched</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs text-slate-500 uppercase tracking-wider"><th class="pb-3 pr-4">Order ID</th><th class="pb-3 pr-4">Customer</th><th class="pb-3 pr-4">Phone</th><th class="pb-3 pr-4">Items</th><th class="pb-3 pr-4">Total</th><th class="pb-3 pr-4">Payment</th><th class="pb-3 pr-4">Status</th><th class="pb-3 pr-4">Date</th><th class="pb-3">Action</th></tr></thead>
            <tbody id="orders-tbody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
